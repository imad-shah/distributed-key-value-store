services:
  node-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - "--id"
      - "node-a"
      - "--config"
      - "/config/cluster.yaml"
    # mount the cluster file here 
    # so changing it doesnt rebuild everything
    volumes:
      - "../config/cluster.yaml:/config/cluster.yaml:ro"
    ports:
      - "8080:8080"
