services:
  node-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - "--id"
      - "3fb21a70-0b5b-47b3-beb4-dc9588889d71"
      - "--config"
      - "/config/cluster.yaml"
    # Mount the cluster config so changes don't require rebuilding.
    volumes:
      - "../config/cluster.yaml:/config/cluster.yaml:ro"
    ports:
      - "8080:8080"

